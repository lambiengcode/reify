<svg viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Retrieval quality with no model involved: the share of tasks where the tool put a changed file in front of the agent, per repository.</title>
  <text x="430" y="26" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle">Retrieval only, no model: was the changed file offered at all?</text>
  <text x="430" y="46" font-size="12" fill="#8b949e" text-anchor="middle">Every condition held to the same 4,000-token budget.</text>
  <line x1="74" y1="246.0" x2="832" y2="246.0" stroke="#8b949e" stroke-opacity="0.55"/>
  <text x="66" y="250.0" font-size="11" fill="#8b949e" text-anchor="end">0%</text>
  <line x1="74" y1="203.0" x2="832" y2="203.0" stroke="#8b949e" stroke-opacity="0.16"/>
  <text x="66" y="207.0" font-size="11" fill="#8b949e" text-anchor="end">25%</text>
  <line x1="74" y1="160.0" x2="832" y2="160.0" stroke="#8b949e" stroke-opacity="0.16"/>
  <text x="66" y="164.0" font-size="11" fill="#8b949e" text-anchor="end">50%</text>
  <line x1="74" y1="117.0" x2="832" y2="117.0" stroke="#8b949e" stroke-opacity="0.16"/>
  <text x="66" y="121.0" font-size="11" fill="#8b949e" text-anchor="end">75%</text>
  <line x1="74" y1="74.0" x2="832" y2="74.0" stroke="#8b949e" stroke-opacity="0.16"/>
  <text x="66" y="78.0" font-size="11" fill="#8b949e" text-anchor="end">100%</text>
  <rect x="143.1" y="228.8" width="48.2" height="17.2" rx="2" fill="#d9822b"/>
  <text x="167.2" y="220.8" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">10%</text>
  <text x="167.2" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">grep</text>
  <rect x="239.4" y="215.9" width="48.2" height="30.1" rx="2" fill="#bf8700"/>
  <text x="263.5" y="207.9" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">18%</text>
  <text x="263.5" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">path grep</text>
  <rect x="335.8" y="147.1" width="48.2" height="98.9" rx="2" fill="#2da44e"/>
  <text x="359.8" y="139.1" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">58%</text>
  <text x="359.8" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">reify</text>
  <text x="263.5" y="288.0" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">ERPNext (Python/JS)</text>
  <rect x="522.1" y="191.3" width="48.2" height="54.7" rx="2" fill="#d9822b"/>
  <text x="546.2" y="183.3" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">32%</text>
  <text x="546.2" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">grep</text>
  <rect x="618.4" y="214.7" width="48.2" height="31.3" rx="2" fill="#bf8700"/>
  <text x="642.5" y="206.7" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">18%</text>
  <text x="642.5" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">path grep</text>
  <rect x="714.8" y="175.6" width="48.2" height="70.4" rx="2" fill="#2da44e"/>
  <text x="738.8" y="167.6" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">41%</text>
  <text x="738.8" y="262.0" font-size="10" fill="#8b949e" text-anchor="middle">reify</text>
  <text x="642.5" y="288.0" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">OpenMRS (Java)</text>
  <text x="430" y="316" font-size="11" fill="#8b949e" text-anchor="middle">Path grep offers 88 files to reach 18%. Offering everything is not retrieval.</text>
</svg>
