<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-label="Reify: at the same token cost a model finds the file that had to change 75% of the time, against 50% for grep." role="img" viewBox="0 0 1280 640"><rect width="1280" height="640" fill="#0d1117"/><g fill="#3fb950" transform="translate(88 74) scale(0.62)"><rect width="9" height="24" x="0" y="0" opacity=".16" rx="2"/><rect width="14" height="24" x="15" y="0" opacity=".34" rx="2"/><rect width="21" height="24" x="35" y="0" opacity=".58" rx="2"/><rect width="7" height="24" x="5" y="36" opacity=".16" rx="2"/><rect width="17" height="24" x="18" y="36" opacity=".36" rx="2"/><rect width="15" height="24" x="41" y="36" opacity=".58" rx="2"/><rect width="12" height="24" x="0" y="72" opacity=".18" rx="2"/><rect width="11" height="24" x="19" y="72" opacity=".34" rx="2"/><rect width="20" height="24" x="36" y="72" opacity=".58" rx="2"/><rect width="56" height="30" x="72" y="0" rx="3"/><rect width="56" height="30" x="72" y="33" rx="3"/><rect width="56" height="30" x="72" y="66" rx="3"/></g><text x="196" y="124" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">reify</text><text x="88" y="268" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">The business logic is</text><text x="88" y="326" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">in one person&apos;s head.</text><text x="88" y="396" fill="#3fb950" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">Reify compiles it out.</text><text x="88" y="452" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="24">Local knowledge engine for AI coding agents</text><text x="720" y="206" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21">Found the file that had to change, same token cost</text><text x="720" y="252" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700">reify ×3 rounds</text><rect width="380" height="34" x="720" y="268" fill="#21262d" rx="6"/><rect width="285" height="34" x="720" y="268" fill="#3fb950" rx="6"/><text x="1122" y="295" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">75%</text><text x="720" y="346" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="500">grep ×3 budget</text><rect width="380" height="34" x="720" y="362" fill="#21262d" rx="6"/><rect width="190" height="34" x="720" y="362" fill="#8b949e" rx="6"/><text x="1122" y="389" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">50%</text><text x="720" y="448" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="20">ERPNext, 40 real merged commits, indexed before them</text><text x="720" y="478" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="20">3 of 4 codebases win by 25–50 points; the 4th ties</text><rect width="1104" height="1" x="88" y="536" fill="#30363d"/><text x="88" y="576" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21">github.com/lambiengcode/reify</text><text x="1192" y="576" fill="#8b949e" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="end">11 languages · zero network calls · Apache-2.0</text></svg>