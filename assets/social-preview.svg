<svg viewBox="0 0 1280 640" width="1280" height="640"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Reify: at the same token cost a model finds the file that had to change
     75% of the time, against 50% for grep.">
  <rect width="1280" height="640" fill="#0d1117"/>

  <g transform="translate(88 74) scale(0.62)" fill="#3fb950">
    <rect x="0" y="0" width="9" height="24" rx="2" opacity="0.16"/>
    <rect x="15" y="0" width="14" height="24" rx="2" opacity="0.34"/>
    <rect x="35" y="0" width="21" height="24" rx="2" opacity="0.58"/>
    <rect x="5" y="36" width="7" height="24" rx="2" opacity="0.16"/>
    <rect x="18" y="36" width="17" height="24" rx="2" opacity="0.36"/>
    <rect x="41" y="36" width="15" height="24" rx="2" opacity="0.58"/>
    <rect x="0" y="72" width="12" height="24" rx="2" opacity="0.18"/>
    <rect x="19" y="72" width="11" height="24" rx="2" opacity="0.34"/>
    <rect x="36" y="72" width="20" height="24" rx="2" opacity="0.58"/>
    <rect x="72" y="0" width="56" height="30" rx="3"/>
    <rect x="72" y="33" width="56" height="30" rx="3"/>
    <rect x="72" y="66" width="56" height="30" rx="3"/>
  </g>
  <text x="196" y="124" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="52"
        font-weight="700" letter-spacing="-1.5" fill="#e6edf3">reify</text>

  <text x="88" y="268" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700"
        letter-spacing="-1" fill="#e6edf3">The business logic is</text>
  <text x="88" y="326" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700"
        letter-spacing="-1" fill="#e6edf3">in one person's head.</text>
  <text x="88" y="396" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700"
        letter-spacing="-1" fill="#3fb950">Reify compiles it out.</text>

  <text x="88" y="452" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#8b949e">Local
  knowledge engine for AI coding agents</text>

  <text x="720" y="206" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#8b949e">Found the file
  that had to change, same token cost</text>

  <text x="720" y="252" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700"
        fill="#e6edf3">reify &#215;3 rounds</text>
  <rect x="720" y="268" width="380" height="34" rx="6" fill="#21262d"/>
  <rect x="720" y="268" width="285" height="34" rx="6" fill="#3fb950"/>
  <text x="1122" y="295" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="30"
        font-weight="700" fill="#e6edf3">75%</text>

  <text x="720" y="346" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="500"
        fill="#8b949e">grep &#215;3 budget</text>
  <rect x="720" y="362" width="380" height="34" rx="6" fill="#21262d"/>
  <rect x="720" y="362" width="190" height="34" rx="6" fill="#8b949e"/>
  <text x="1122" y="389" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="30"
        font-weight="700" fill="#8b949e">50%</text>
  <text x="720" y="448" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#8b949e">ERPNext,
  40 real merged commits, indexed before them</text>
  <text x="720" y="478" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#8b949e">3 of 4
  codebases win by 25&#8211;50 points; the 4th ties</text>

  <rect x="88" y="536" width="1104" height="1" fill="#30363d"/>
  <text x="88" y="576" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#8b949e">github.com/lambiengcode/reify</text>
  <text x="1192" y="576" text-anchor="end" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="21"
        fill="#8b949e">11 languages &#183; zero network calls &#183; Apache-2.0</text>
</svg>
