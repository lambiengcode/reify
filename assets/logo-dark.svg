<svg viewBox="0 0 566 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reify">
  <title>Reify</title>
  <desc>Three rows of scattered fragments on the left — code, documents, history — become the same three rows aligned into one solid column on the right. Thin seams remain between them, because compiled knowledge keeps its sources traceable.</desc>

  <!--
    The mark is the word, drawn. The same three rows appear twice: loose and faint on
    the left, aligned and solid on the right. Nothing is added between them and nothing
    is lost — the seams stay, because Reify compiles knowledge without dissolving where
    it came from, and every claim it makes still carries its evidence.
  -->
  <g transform="translate(26 22)" fill="#e6edf3">
    <!-- row 1 — code -->
    <rect x="0"  y="0"  width="9"  height="24" rx="2" opacity="0.14"/>
    <rect x="15" y="0"  width="14" height="24" rx="2" opacity="0.28"/>
    <rect x="35" y="0"  width="21" height="24" rx="2" opacity="0.50"/>
    <!-- row 2 — documents -->
    <rect x="5"  y="36" width="7"  height="24" rx="2" opacity="0.14"/>
    <rect x="18" y="36" width="17" height="24" rx="2" opacity="0.30"/>
    <rect x="41" y="36" width="15" height="24" rx="2" opacity="0.50"/>
    <!-- row 3 — history -->
    <rect x="0"  y="72" width="12" height="24" rx="2" opacity="0.16"/>
    <rect x="19" y="72" width="11" height="24" rx="2" opacity="0.28"/>
    <rect x="36" y="72" width="20" height="24" rx="2" opacity="0.50"/>

    <!-- the same three rows, compiled: aligned, solid, still separable -->
    <rect x="72" y="0"  width="56" height="30" rx="3"/>
    <rect x="72" y="33" width="56" height="30" rx="3"/>
    <rect x="72" y="66" width="56" height="30" rx="3"/>
  </g>

  <text x="188" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2" fill="#e6edf3">reify</text>
</svg>
