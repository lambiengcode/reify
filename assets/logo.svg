<svg xmlns="http://www.w3.org/2000/svg" aria-label="Reify" role="img" viewBox="0 0 566 140"><title>Reify</title><desc>Three rows of scattered fragments on the left - code, documents, history - become the same three rows aligned into one solid column on the right. Thin seams remain between them, because compiled knowledge keeps its sources traceable.</desc><g fill="#2da44e" transform="translate(26 22)"><rect width="9" height="24" x="0" y="0" opacity=".16" rx="2"/><rect width="14" height="24" x="15" y="0" opacity=".34" rx="2"/><rect width="21" height="24" x="35" y="0" opacity=".58" rx="2"/><rect width="7" height="24" x="5" y="36" opacity=".16" rx="2"/><rect width="17" height="24" x="18" y="36" opacity=".36" rx="2"/><rect width="15" height="24" x="41" y="36" opacity=".58" rx="2"/><rect width="12" height="24" x="0" y="72" opacity=".18" rx="2"/><rect width="11" height="24" x="19" y="72" opacity=".34" rx="2"/><rect width="20" height="24" x="36" y="72" opacity=".58" rx="2"/><rect width="56" height="30" x="72" y="0" rx="3"/><rect width="56" height="30" x="72" y="33" rx="3"/><rect width="56" height="30" x="72" y="66" rx="3"/></g><text x="188" y="93" fill="#111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">reify</text></svg>