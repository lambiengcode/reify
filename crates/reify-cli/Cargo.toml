[package]
name = "reify-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "reify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
owo-colors = "4.3.0"
reify = { path = "../reify" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
